name: Backend Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ProjectPortal.slnx

      - name: Run tests
        run: dotnet test ProjectPortal.slnx --configuration Release --no-restore
